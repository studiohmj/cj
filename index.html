/* Layout: CBT 시험 화면 — 상단 고정 시험 바 + 문제지(좌) / 답안 표기란(우), 홈은 공식 시간표 표 중심 */
:root{
  --bg:#F2F4F7; --paper:#FFFFFF; --ink:#151922; --sub:#4A5261; --muted:#7F8896; --line:#E2E6EC; --line2:#CBD2DC;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E9EFFD;
  --omr:#D94A66; --omr-soft:#FDEFF2;
  --ok:#11805B; --ok-soft:#E3F3EB; --bad:#CC4128; --bad-soft:#FCEAE5; --warn:#B26A00;
  --bar:#151922; --bar-fg:#F4F6F9; --bar-sub:#97A0AF; --bar-line:#2A303B;
  --f:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1014; --paper:#171A20; --ink:#E8EBF0; --sub:#B3BAC6; --muted:#7D8695; --line:#262B33; --line2:#363D48;
  --accent:#7D9BFF; --accent-ink:#0B1020; --accent-soft:#1D2646;
  --omr:#F07B92; --omr-soft:#3A1E26;
  --ok:#45BF8E; --ok-soft:#11301F; --bad:#FF7D61; --bad-soft:#3A1D16; --warn:#F2B04A;
  --bar:#1C2028; --bar-fg:#E8EBF0; --bar-sub:#8D96A5; --bar-line:#2D333E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1014; --paper:#171A20; --ink:#E8EBF0; --sub:#B3BAC6; --muted:#7D8695; --line:#262B33; --line2:#363D48;
  --accent:#7D9BFF; --accent-ink:#0B1020; --accent-soft:#1D2646;
  --omr:#F07B92; --omr-soft:#3A1E26;
  --ok:#45BF8E; --ok-soft:#11301F; --bad:#FF7D61; --bad-soft:#3A1D16; --warn:#F2B04A;
  --bar:#1C2028; --bar-fg:#E8EBF0; --bar-sub:#8D96A5; --bar-line:#2D333E; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:break-word}
body.exam::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.3;letter-spacing:-0.02em}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:760px}
.stack{display:flex;flex-direction:column;gap:28px;padding-block:28px 64px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .sub{color:var(--sub)} .small{font-size:13px}

  e:"실패 원인이 '알아보지 못할 만큼 바꾸는 것'이고, 소비자는 색·형태·배치로 제품을 찾으므로 그 단서를 유지해야 합니다.",
  t:"빈칸 앞의 '따라서'는 앞 문장의 결론을 요구합니다. 앞 내용과 같은 방향의 선택지를 고르세요."},
 {sh:1,p:"한 연구팀은 제품 뒷면의 영양 정보를 앞면에 신호등 색으로 표시하자 고나트륨 제품의 판매가 줄었다고 발표했다. 연구팀은 소비자가 복잡한 숫자보다 직관적인 색 정보에 더 민감하게 반응하기 때문이라고 주장했다.",
  q:"연구팀의 주장을 가장 강화하는 것은?",o:["숫자로만 앞면에 표시한 매장에서는 판매 변화가 거의 없었다.","같은 기간 고나트륨 제품의 가격이 일제히 인상되었다.","신호등 표시를 도입한 매장의 방문객 수가 크게 줄었다.","응답자 대부분이 영양 정보를 읽지 않는다고 답했다.","저나트륨 신제품 출시가 같은 시기에 몰렸다."],a:0,
  e:"같은 위치에 숫자만 표시했을 때 변화가 없었다면, 효과의 원인이 '색'이라는 점이 분명해집니다. 가격 인상, 방문객 감소, 신제품 출시는 다른 원인이라 오히려 약화합니다.",
  t:"강화 문제의 최고 정답은 '그 요인만 빼면 결과가 사라진다'는 대조 근거입니다."},
 {sh:1,p:"'가성비'라는 말이 처음 쓰일 때 그것은 가격 대비 성능을 따지는 합리적 소비를 뜻했다. 이후 '가심비'라는 말이 등장하면서 소비자는 가격 대비 심리적 만족을 중시하기 시작했다. 최근에는 시간 대비 효용을 뜻하는 '시성비'까지 쓰인다. 이처럼 소비를 평가하는 기준은 시대에 따라 성능에서 감정, 그리고 시간으로 옮겨 가고 있다.",
  q:"윗글의 서술 방식으로 가장 적절한 것은?",o:["용어의 변화를 시간 순서로 제시하여 경향을 이끌어 낸다.","대상의 장단점을 비교하여 절충안을 제시한다.","통계 자료를 근거로 통념을 반박한다.","전문가의 견해를 인용하여 주장의 권위를 높인다.","가설을 세우고 실험을 통해 검증한다."],a:0,
  e:"가성비 → 가심비 → 시성비를 순서대로 나열한 뒤 '이처럼'으로 경향을 정리했습니다. 통계, 인용, 실험은 등장하지 않습니다.",
  t:"서술 방식 문제는 지문에 '숫자·인용부호·실험'이 있는지부터 확인하면 오답이 빠르게 지워집니다."},
 {sh:1,p:P_MEAT,q:"윗글의 내용과 일치하는 것은?",o:["식물성 고기는 첨가물 사용과 관련된 비판을 받는다.","배양육은 이미 대량 생산 단계에 들어섰다.","배양육은 식물성 단백질을 원료로 한다.","대체육 시장은 재구매율이 높아 빠르게 성장했다.","업계는 대체육을 단독 제품으로만 판매하려 한다."],a:0,
  e:"대량 생산 단계에 들어선 것은 식물성 고기이고, 배양육은 동물 세포가 원료입니다. 시장 성장은 재구매 부족으로 느리며, 업계는 가공식품 원료로 활용을 늘리고 있습니다.",
  t:"두 대상(식물성 고기/배양육)이 나오면 특징을 서로 바꿔치기한 선택지를 조심하세요."},
 {sh:1,p:P_MEAT,q:"윗글에서 업계가 대체육을 가공식품 원료로 활용하는 이유로 가장 적절한 것은?",o:["익숙한 형태로 제공해 거부감을 줄이고 반복 구매로 이어지게 하려고","배양액 비용을 낮추기 위해","첨가물 사용을 완전히 없애기 위해","호기심에 의한 첫 구매를 늘리기 위해","배양육의 맛을 식물성 고기 수준으로 맞추기 위해"],a:0,
  e:"문제는 '한 번 구매 후 재구매로 이어지지 않는 것'이었고, 그 해결책으로 익숙한 가공식품의 원료로 쓰는 것입니다.",
  t:"'이를 극복하기 위해'의 '이'가 가리키는 문제를 찾으면 전략의 목적이 보입니다."},
 {sh:1,p:"이번 캠페인은 브랜드 인지도를 끌어올리는 데는 성공했지만, 매출로 이어지지 못했다는 점에서 절반의 성공에 그쳤다.",
  q:"밑줄 친 '그쳤다'와 가장 가까운 의미로 쓰인 것은? (밑줄: 그쳤다)",o:["그는 사과 한마디에 그치지 않고 보상까지 약속했다.","비가 그치자 하늘에 무지개가 떴다.","아이의 울음이 좀처럼 그치지 않았다.","공장의 기계 소리가 갑자기 그쳤다.","웃음소리가 그친 교실은 조용했다."],a:0,
  e:"지문의 '그치다'는 '어떤 상태에서 더 나아가지 못하다'는 뜻입니다. 나머지는 모두 '계속되던 것이 멈추다'는 뜻입니다.",
  t:"다의어 문제는 '~에 그치다'처럼 앞에 붙는 조사까지 같은 형태를 찾으면 빠릅니다."},
 {sh:1,p:"우리 회사가 신제품 패키지에 친환경 소재를 쓰면 MZ세대 소비자의 구매가 늘 것이다. 따라서 친환경 소재 도입은 매출 증대에 도움이 된다.",
  q:"위 논증이 성립하기 위해 전제되어야 하는 것은?",o:["MZ세대의 구매 증가가 다른 소비자층의 구매 감소로 상쇄되지 않는다.","친환경 소재는 기존 소재보다 비싸다.","MZ세대는 가격에 민감하다.","경쟁사도 친환경 소재를 쓰고 있다.","친환경 소재는 디자인 표현에 제약이 있다."],a:0,
  e:"MZ세대 구매가 늘어도 다른 층의 구매가 그만큼 줄면 매출은 늘지 않습니다. 결론으로 가려면 이 공백을 메우는 전제가 필요합니다.",
  t:"숨은 전제는 '근거와 결론 사이의 빈틈'입니다. 그 빈틈이 깨지면 결론이 무너지는지 확인하세요."},
 {sh:1,p:"과자 봉지를 뜯을 때 나는 바스락 소리는 단순한 소음이 아니다. 실험에 따르면 같은 감자칩이라도 씹을 때 나는 소리를 키워서 들려주면 사람들은 더 바삭하고 신선하다고 평가했다. 이 때문에 일부 기업은 포장재의 소재와 두께를 조절해 개봉 소리까지 설계한다. 제품 경험이 미각 하나로 완성되지 않는다는 점을 보여 주는 사례다.",
  q:"윗글의 제목으로 가장 적절한 것은?",o:["소리도 맛의 일부가 된다: 청각과 제품 경험","감자칩의 바삭함을 결정하는 조리법","포장재 두께 조절을 통한 원가 절감","소음 공해를 줄이는 포장 기술","미각이 다른 감각보다 중요한 이유"],a:0,
  e:"소리가 맛 평가에 영향을 준다는 실험과, 그래서 기업이 소리까지 설계한다는 내용을 모두 담은 제목입니다.",
  t:"제목은 글 전체를 덮어야 합니다. 한 문장에만 해당하는 선택지(조리법, 원가)는 지우세요."},
 {sh:1,p:"일부에서는 AI가 생성한 이미지가 디자이너의 일을 대체할 것이라고 주장한다. AI는 몇 초 만에 수십 개의 시안을 만들 수 있고, 비용도 거의 들지 않기 때문이다.",
  q:"위 주장에 대한 반론으로 가장 적절한 것은?",o:["디자인 업무의 핵심은 시안 생성보다 브랜드 전략에 맞는 안을 판단하고 조율하는 데 있다.","AI가 만들 수 있는 시안의 수는 앞으로 더 늘어날 것이다.","AI 이미지 생성 서비스의 이용 요금이 내려가고 있다.","많은 기업이 AI 도입을 검토하고 있다.","AI는 사람보다 빠르게 이미지를 만든다."],a:0,
  e:"주장의 근거는 '빠르고 싸게 시안을 만든다'입니다. 디자이너의 핵심 업무가 시안 생성이 아니라면 그 근거가 대체의 이유가 되지 못합니다. 나머지는 주장을 지지하는 내용입니다.",
  t:"반론은 '근거가 결론으로 이어지지 않는 이유'를 보여 주는 선택지입니다."},
 {sh:1,p:"온라인 상품 리뷰의 별점 분포는 보통 종 모양이 아니라 J자 모양을 이룬다. 5점이 가장 많고, 그다음이 1점이며, 2~4점은 상대적으로 적다. 이는 매우 만족했거나 매우 불만족한 소비자가 리뷰를 남길 동기가 더 크기 때문이다. 따라서 평균 별점만으로 제품의 실제 품질을 판단하면 적당히 만족한 다수의 의견이 반영되지 않을 수 있다.",
  q:"윗글의 내용과 일치하는 것은?",o:["평균 별점은 적당히 만족한 소비자의 의견을 충분히 반영하지 못할 수 있다.","리뷰 별점은 대체로 3점에 가장 많이 몰린다.","1점 리뷰는 2~4점 리뷰보다 적은 편이다.","리뷰를 남기는 소비자는 전체 구매자를 고르게 대표한다.","매우 만족한 소비자는 리뷰를 남기지 않는 경향이 있다."],a:0,
  e:"마지막 문장의 내용입니다. 분포는 J자(5점 최다, 1점 다음)이고, 리뷰는 극단적인 소비자가 더 많이 남깁니다.",
  t:"순서(가장 많다, 그다음)가 나오는 지문은 순위를 메모해 두면 바꿔치기 오답이 바로 보입니다."}
],
reasoning:[
 {sh:1,q:"다음 전제가 모두 참일 때, 반드시 참인 결론은?\n· 모든 디자이너는 마감을 지킨다.\n· 어떤 신입사원은 디자이너다.",o:["어떤 신입사원은 마감을 지킨다.","모든 신입사원은 마감을 지킨다.","마감을 지키는 사람은 모두 디자이너다.","어떤 디자이너는 신입사원이 아니다.","신입사원은 디자이너가 아니다."],a:0,
  e:"디자이너인 신입사원이 최소 1명 있고, 그 사람은 마감을 지킵니다. 따라서 '어떤 신입사원은 마감을 지킨다'만 반드시 참입니다.",
  t:"'어떤 A는 B' + '모든 B는 C' → '어떤 A는 C'. 가장 자주 나오는 형태입니다."},
 {sh:1,q:"A, B, C, D 네 사람이 1~4층에 한 명씩 산다. 다음 조건이 모두 참일 때 반드시 참인 것은?\n· C는 1층에 산다.\n· D는 A의 바로 아래층에 산다.\n· A는 B보다 위층에 산다.",o:["B는 2층에 산다.","A는 3층에 산다.","D는 2층에 산다.","B는 D보다 위층에 산다.","A와 C는 인접한 층에 산다."],a:0,
  e:"남은 층은 2·3·4층입니다. A=3층이면 D=2층, B=4층이 되어 'A가 B보다 위'를 어깁니다. 따라서 A=4층, D=3층, B=2층이 유일합니다.",
  t:"고정 조건(C=1층)을 먼저 채우고, '바로 아래' 같은 묶음 조건을 덩어리로 넣어 보세요."},
 {sh:1,q:"다음 명제가 모두 참일 때 반드시 참인 것은?\n· 운동을 하면 잠을 잘 잔다.\n· 잠을 잘 자면 집중력이 높다.",o:["집중력이 높지 않으면 운동을 하지 않은 것이다.","집중력이 높으면 운동을 한 것이다.","잠을 잘 자지 못하면 집중력이 낮다.","운동을 하지 않으면 잠을 잘 자지 못한다.","잠을 잘 자면 운동을 한 것이다."],a:0,
  e:"운동→잠→집중이므로 운동→집중입니다. 그 대우(순서를 뒤집고 둘 다 부정)인 '집중 X → 운동 X'만 반드시 참입니다. 화살표만 뒤집은 '역'이나 부정만 한 '이'는 보장되지 않습니다.",
  t:"반드시 참 = 원래 명제 또는 대우뿐입니다."},
 {q:"A, B, C 중 한 명만 쿠폰을 받았다. 세 명 중 한 명만 거짓말을 한다. 쿠폰을 받은 사람과 거짓말한 사람을 순서대로 고르면?\n· A: \"B가 받았다.\"\n· B: \"C가 받았다.\"\n· C: \"나는 받지 않았다.\"",o:["A / B","B / B","B / A","C / B","A / C"],a:1,
  e:"A와 B의 말은 동시에 참일 수 없으니 거짓말쟁이는 A 또는 B이고, C는 진실입니다. C는 받지 않았으니 B의 말이 거짓 → B가 거짓말쟁이, A는 진실 → B가 받았습니다.",
  t:"서로 모순되는 두 진술을 먼저 찾으세요. 그 둘 중에 거짓말쟁이가 있으니 나머지는 전부 진실입니다."},
 {q:"신제품 P, Q, R, S, T의 판매 순위(1~5위, 동순위 없음)에 대한 조건이 다음과 같을 때 2위는?\n· P는 3위다.\n· T는 Q의 바로 다음 순위다.\n· Q는 1위가 아니다.\n· R은 S보다 순위가 높다.",o:["P","Q","R","S","T"],a:3,
  e:"Q-T 연속 묶음은 Q=2이면 T=3(P와 충돌)이라 불가, Q=4, T=5만 가능합니다. 남은 1·2위에 R이 앞서도록 R=1, S=2.",
  t:"연속 묶음은 들어갈 자리가 적어서 먼저 넣어 보면 빠르게 풀립니다."},
 {sh:1,q:"다음 전제가 모두 참일 때 반드시 참인 것은?\n· 어떤 포장재는 재활용이 가능하다.\n· 재활용이 가능한 모든 것은 분리배출 대상이다.",o:["어떤 포장재는 분리배출 대상이다.","모든 포장재는 분리배출 대상이다.","분리배출 대상은 모두 포장재다.","어떤 포장재는 재활용이 불가능하다.","재활용이 가능한 것은 모두 포장재다."],a:0,
  e:"재활용 가능한 포장재가 최소 1개 있고 그것은 분리배출 대상입니다. '어떤 포장재는 재활용이 불가능하다'는 그럴 수도 있지만 반드시 참은 아닙니다.",
  t:"첫 문제와 같은 구조입니다. 소재만 바꿔 반복 출제되니 구조로 익히세요."},
 {sh:1,q:"결론이 반드시 참이 되려면 빈칸에 들어갈 전제로 가장 적절한 것은?\n· 전제1: 신제품을 출시하는 팀은 모두 시장조사를 한다.\n· 전제2: (          )\n· 결론: 디자인팀은 시장조사를 한다.",o:["디자인팀은 신제품을 출시한다.","시장조사를 하는 팀은 신제품을 출시한다.","디자인팀은 시장조사를 좋아한다.","신제품을 출시하지 않는 팀은 시장조사를 하지 않는다.","어떤 팀은 시장조사를 하지 않는다."],a:0,
  e:"출시팀 → 시장조사. 디자인팀이 출시팀에 들어가면 결론이 나옵니다.",
  t:"빈칸 전제는 결론의 주어(디자인팀)와 전제1의 조건(출시)을 이어 주는 문장입니다."},
 {sh:1,q:"회의 참석에 대한 조건이 다음과 같다. D가 참석했을 때 반드시 참인 것은?\n· A가 참석하면 B도 참석한다.\n· C가 참석하면 A는 참석하지 않는다.\n· B와 D 중 정확히 한 명만 참석한다.",o:["A는 참석하지 않는다.","A는 참석한다.","C는 참석한다.","C는 참석하지 않는다.","B는 참석한다."],a:0,
  e:"D 참석 → B 불참. 'A→B'의 대우 'B 불참 → A 불참'으로 A는 불참입니다. C는 어느 쪽이든 조건을 어기지 않아 알 수 없습니다.",
  t:"확정된 사실(D 참석)에서 출발해 대우로 한 칸씩 따라가세요."},
 {sh:1,q:"A~F 여섯 명이 왼쪽부터 1~6번 자리에 한 줄로 앉는다. 다음 조건이 모두 참일 때 반드시 참인 것은?\n· A는 3번 자리다.\n· F는 6번 자리다.\n· C와 D는 서로 이웃해 앉는다.\n· E는 B보다 오른쪽에 앉는다.\n· B는 1번 자리가 아니다.",o:["B는 4번 자리다.","C는 1번 자리다.","E는 B보다 왼쪽에 앉는다.","D는 5번 자리다.","C와 F는 이웃해 앉는다."],a:0,
  e:"남은 자리는 1·2·4·5번. C-D가 4·5번이면 B·E가 1·2번인데 B는 1번이 아니므로 B=2, E=1이 되어 'E가 B보다 오른쪽'을 어깁니다. 따라서 C-D는 1·2번(순서 미정), B=4, E=5.",
  t:"고정석(A, F)으로 빈자리를 나누고, 이웃 묶음(C-D)이 들어갈 수 있는 칸을 경우로 나눠 보세요."},
 {q:"다음 전제를 바탕으로 A, B를 판단한 것으로 옳은 것은?\n· 모든 신제품은 시식회를 거친다.\n· 시식회를 거친 제품 중 일부는 출시되지 않는다.\n· 출시된 제품은 모두 광고를 한다.\n\nA: 어떤 신제품은 광고를 하지 않는다.\nB: 광고를 하는 제품은 모두 시식회를 거쳤다.",o:AB,a:4,
  e:"출시되지 않은 시식회 제품이 신제품인지는 알 수 없고, 출시되지 않았다고 광고를 안 한다는 근거도 없습니다(A 판단 불가). '출시→광고'에서 '광고→시식회'는 이끌어 낼 수 없습니다(B 판단 불가).",
  t:"'일부'와 '모든'이 섞이면 '알 수 없음'이 정답인 경우가 많습니다. 반례가 하나라도 가능한지 떠올려 보세요."},
 {q:"다음 전제를 바탕으로 A, B를 판단한 것으로 옳은 것은?\n· 커피를 좋아하는 사람은 모두 디저트를 좋아한다.\n· 디저트를 좋아하는 사람은 모두 단 음료를 좋아하지 않는다.\n· 지수는 커피를 좋아한다.\n\nA: 지수는 단 음료를 좋아하지 않는다.\nB: 단 음료를 좋아하는 사람은 커피를 좋아하지 않는다.",o:AB,a:2,
  e:"커피→디저트→단 음료 X. 지수는 커피를 좋아하므로 A는 참. '커피→단 음료 X'의 대우가 '단 음료→커피 X'이므로 B도 참.",
  t:"B처럼 일반 명제가 나오면 연결한 명제의 '대우'인지 확인하세요."},
 {q:"다섯 명 중 한 명이 회의실 예약을 깜빡했다. 다섯 명 중 한 명만 거짓말을 할 때, 예약을 깜빡한 사람은?\n· A: \"C가 깜빡했다.\"\n· B: \"나는 아니다.\"\n· C: \"D가 깜빡했다.\"\n· D: \"C의 말은 거짓이다.\"\n· E: \"나는 아니다.\"",o:["A","B","C","D","E"],a:2,
  e:"C와 D의 말은 정반대이므로 둘 중 한 명이 거짓말쟁이이고, A·B·E는 진실입니다. A의 말에 따라 C가 깜빡했고, 그러면 C의 말이 거짓이 됩니다.",
  t:"'○○의 말은 거짓이다'라는 진술은 두 사람을 반대로 묶어 줍니다. 그 둘을 빼면 나머지는 모두 진실."},
 {sh:1,q:"P, Q, R, S, T 다섯 지점의 매출에 대해 다음이 참일 때 반드시 참인 것은? (동일 매출 없음)\n· P는 Q보다 매출이 높다.\n· Q는 S보다 매출이 높다.\n· R은 S보다 매출이 낮다.\n· T는 Q보다 매출이 낮다.",o:["P의 매출이 가장 높다.","T의 매출이 가장 낮다.","S의 매출은 3위다.","R의 매출이 가장 낮다.","T는 S보다 매출이 낮다."],a:0,
  e:"P>Q이고 Q는 S, R, T보다 높으므로 P가 1위, Q가 2위입니다. S, R, T 사이에서는 S>R만 확정이고 T의 위치는 알 수 없습니다.",
  t:"부등호를 한 줄로 이어 그려 보고, 연결이 끊긴 사람(T)은 '알 수 없음'으로 표시하세요."},
 {sh:1,q:"다음 명제가 모두 참일 때 반드시 참인 것은?\n· 기획에 참여하면 회의에 참석한다.\n· 보고서를 쓰지 않으면 회의에 참석하지 않는다.\n· 발표를 하면 기획에 참여한다.",o:["발표를 하면 보고서를 쓴다.","보고서를 쓰면 발표를 한다.","회의에 참석하면 기획에 참여한다.","보고서를 쓰지 않으면 기획에 참여한다.","회의에 참석하지 않으면 보고서를 쓰지 않는다."],a:0,
  e:"둘째 명제의 대우는 '회의 참석 → 보고서 작성'. 이어 붙이면 발표 → 기획 → 회의 → 보고서. 따라서 '발표를 하면 보고서를 쓴다'.",
  t:"'~하지 않으면 ~하지 않는다' 꼴은 대우로 바꿔 긍정문으로 만든 뒤 사슬을 이으세요."},
 {q:"월요일부터 금요일까지 A, B, C, D, E가 하루씩 당직을 선다. 다음 조건이 모두 참일 때 목요일 당직은?\n· A는 수요일에 당직을 선다.\n· B는 C보다 먼저 당직을 선다.\n· D는 E의 바로 다음 날 당직을 선다.\n· C는 금요일에 당직을 서지 않는다.",o:["A","B","C","D","E"],a:4,
  e:"E-D 연속은 (월,화) 또는 (목,금). (월,화)이면 B·C가 목·금인데 B가 먼저라 C=금요일 → 위반. 따라서 E=목, D=금, B=월, C=화.",
  t:"연속 조건(E 다음 날 D)을 넣을 수 있는 경우가 2개뿐이면 둘 다 그려서 하나를 지우세요."},
 {q:"다음 전제를 바탕으로 A, B를 판단한 것으로 옳은 것은?\n· 어떤 마케터는 영어를 잘한다.\n· 영어를 잘하는 사람은 모두 해외 출장을 간다.\n\nA: 어떤 마케터는 해외 출장을 간다.\nB: 모든 마케터는 해외 출장을 간다.",o:AB,a:0,
  e:"영어를 잘하는 마케터는 해외 출장을 가므로 A는 참입니다. 영어를 못하는 마케터가 있을 수 있으므로 B는 알 수 없습니다.",
  t:"전제에 '어떤'이 있으면 결론도 '어떤'까지만 갑니다. '모든'으로 넓히면 함정."},
 {q:"다음 조건이 모두 참일 때, 참가하는 사람을 모두 고르면?\n· A와 B 중 적어도 한 명은 참가한다.\n· B가 참가하면 C는 참가하지 않는다.\n· C가 참가하지 않으면 D도 참가하지 않는다.\n· D는 참가한다.",o:["C, D","B, C, D","A, D","A, C, D","A, B, C, D"],a:3,
  e:"D 참가 → (셋째 조건의 대우) C 참가 → (둘째 조건의 대우) B 불참 → (첫째 조건) A 참가. 참가자는 A, C, D.",
  t:"확정된 사람에서 출발해 대우를 연쇄로 적용하세요. 순서대로 D → C → B → A."},
 {q:"A~E 다섯 명의 키에 대해 다음이 참일 때, 두 번째로 키가 작은 사람은? (같은 키 없음)\n· A는 C보다 크다.\n· B는 D보다 크고 E보다 작다.\n· C는 E보다 크다.",o:["A","B","C","D","E"],a:1,
  e:"A > C > E > B > D 로 한 줄이 됩니다. 두 번째로 작은 사람은 B.",
  t:"'두 번째로 작은'처럼 방향이 바뀐 발문은 한 번 더 읽고 답을 고르세요."},
 {q:"카페 메뉴 아메리카노, 라떼, 모카, 티의 가격은 모두 다르다. 다음 전제를 바탕으로 A, B를 판단한 것으로 옳은 것은?\n· 라떼는 아메리카노보다 비싸다.\n· 모카는 라떼보다 비싸다.\n· 티는 아메리카노보다 싸다.\n\nA: 모카가 가장 비싸다.\nB: 아메리카노는 두 번째로 비싸다.",o:AB,a:0,
  e:"티 < 아메리카노 < 라떼 < 모카. 모카가 가장 비싸므로 A는 참. 아메리카노는 세 번째로 비싸므로 B는 거짓.",
  t:"'두 번째로 비싸다'처럼 순위가 나오면 위에서부터 번호를 매겨 확인하세요."},
 {sh:1,q:"다음 전제가 모두 참일 때 반드시 참인 것은?\n· 모든 A팀원은 포토샵을 쓴다.\n· 일러스트를 쓰는 사람 중에는 포토샵을 쓰지 않는 사람이 있다.",o:["일러스트를 쓰는 사람 중에는 A팀원이 아닌 사람이 있다.","모든 A팀원은 일러스트를 쓴다.","일러스트를 쓰는 사람은 모두 A팀원이 아니다.","포토샵을 쓰는 사람은 모두 A팀원이다.","어떤 A팀원은 포토샵을 쓰지 않는다."],a:0,
  e:"'A팀원 → 포토샵'의 대우는 '포토샵 X → A팀원 X'. 포토샵을 쓰지 않는 일러스트 사용자는 A팀원이 아니므로, 일러스트 사용자 중 A팀원이 아닌 사람이 있습니다.",
  t:"'~하지 않는 사람이 있다'가 나오면 그 사람에게 대우를 적용해 보세요."}
],
data:[
 {tb:T1,q:"2024년 대비 2025년 매출 증가율이 가장 큰 브랜드는?",o:["가","나","다","라","마"],a:4,
  e:"증가율 = 증가액 ÷ 2024년 × 100. 가 25%, 나 −10%, 다 25%, 라 10%, 마 50%.",
  t:"원래 값이 작은데 많이 늘었으면(마: 50→75) 바로 후보입니다."},
 {tb:T1,q:"2024년 전체 매출에서 브랜드 '나'가 차지하는 비중은?",o:["25.0%","30.0%","약 33.3%","36.0%","40.0%"],a:2,
  e:"200 ÷ 600 = 1/3 ≈ 33.3%.",
  t:"비중 = 부분 ÷ 전체. 약분(200/600=1/3)하면 계산이 필요 없습니다."},
 {tb:T1,q:"2024년 대비 2025년 전체 매출 증가율은?",o:["약 9%","약 11.7%","약 13%","약 15%","약 70%"],a:1,
  e:"(670−600) ÷ 600 = 70/600 ≈ 11.7%. 약 70%는 증가액(70억)을 증가율로 착각한 함정입니다.",
  t:"600의 10%는 60. 증가액 70은 60보다 조금 크니까 '10%보다 조금 큰 값'을 고르면 됩니다."},
 {sh:1,tb:T1,q:"[표 1]에 대한 설명으로 옳은 것은?",o:["'가'와 '다'의 증가율은 같다.","모든 브랜드의 매출이 증가했다.","'라'의 매출 증가액이 가장 크다.","2025년 매출 1위 브랜드는 '라'다.","'마'의 2025년 매출은 2024년의 2배다."],a:0,
  e:"가와 다 모두 25%입니다. '나'는 감소했고, 증가액은 가(30억)가 가장 크며, 2025년 1위는 나(180억), 마는 1.5배입니다.",
  t:"'옳은 것' 고르기는 표에서 바로 보이는 선택지(1위, 증감 여부)부터 지우세요."},
 {tb:T2,q:"제품 X의 2월 대비 4월 판매량 증가율은?",o:["12.5%","15%","17.5%","20%","25%"],a:3,
  e:"(60−50) ÷ 50 × 100 = 20%. 25%는 분모를 1월(40)로 잡은 함정.",
  t:"기준이 '2월'이므로 분모는 50."},
 {tb:T2,q:"1~4월 제품 X의 월평균 판매량은?",o:["48,750개","49,000개","50,000개","51,250개","52,500개"],a:0,
  e:"40+50+45+60 = 195 → 195 ÷ 4 = 48.75(천 개) = 48,750개.",
  t:"평균은 합계 ÷ 개수. 합계(195)만 정확하면 됩니다."},
 {tb:T2,q:"4월 제품 X의 매출액은?",o:["1,500만 원","1억 원","1억 2,000만 원","1억 5,000만 원","15억 원"],a:3,
  e:"60,000개 × 2,500원 = 150,000,000원 = 1억 5,000만 원.",
  t:"표는 '천 개' 단위라 60 → 60,000개. 6 × 25 = 150을 먼저 구하고 0을 붙이세요."},
 {tb:T2,q:"3월 판매량은 전월 대비 몇 % 감소했는가?",o:["10%","11.1%","12%","12.5%","15%"],a:0,
  e:"(50−45) ÷ 50 × 100 = 10%. 11.1%는 분모를 45로 잡은 함정.",
  t:"'전월 대비' → 분모는 항상 이전 달(2월=50)."},
 {tb:T3,q:"2025년 수출액의 전년 대비 증가율이 가장 높은 지역은?",o:["유럽","일본","동남아","북미","네 지역 모두 같다"],a:3,
  e:"북미 90/540 ≈ 16.7%, 유럽 12/240 = 5%, 일본 15/285 ≈ 5.3%, 동남아 36/234 ≈ 15.4%.",

 {tb:T3,q:"[표 3]에 대한 설명으로 옳은 것만을 모두 고르면?\nㄱ. 2022~2025년 동안 수출액이 매년 증가한 지역은 3곳이다.\nㄴ. 2025년 전체 수출액에서 북미가 차지하는 비중은 40% 이상이다.\nㄷ. 동남아의 2025년 수출액은 2022년의 2배 이상이다.\nㄹ. 일본의 수출액이 가장 적었던 해는 2024년이다.",o:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],a:3,

 {tb:T3,q:"2022년 대비 2025년 전체 수출액 증가율은?",o:["약 32%","약 35%","약 38%","약 40%","약 42%"],a:2,

 {sh:1,tb:T4,q:"[표 4]에 대한 설명으로 옳은 것은?",o:["'편의성'을 꼽은 20대와 30대 응답자 수의 합은 220명이다.","모든 연령대에서 '맛'의 비율이 가장 높다.","'가격'을 꼽은 응답자 수는 30대가 20대보다 많다.","연령대가 높을수록 '브랜드'의 비율이 높아진다.","전체 응답자 중 '맛'을 꼽은 비율은 30% 이상이다."],a:0,

 {tb:T7,q:"밀의 단가가 25% 오르고 구매량이 20% 줄면, 밀 구매 금액은 어떻게 변하는가?",o:["20% 감소","5% 감소","변화 없음","5% 증가","45% 증가"],a:2,

 {tb:T3,q:"유럽의 수출액이 2026년에도 2025년과 같은 증가율로 늘어난다면, 2026년 유럽 수출액은?",o:["264.0백만 달러","264.6백만 달러","270.0백만 달러","277.2백만 달러","302.4백만 달러"],a:1,

 {q:"A는 혼자 6일, B는 혼자 3일 걸리는 일을 둘이 함께 하면 며칠이 걸리는가?",o:["2일","2.5일","3일","4일","4.5일"],a:0,

 {q:"빈 수조를 A관으로는 12시간, B관으로는 6시간 만에 채울 수 있다. A관만 3시간 틀어 놓은 뒤 두 관을 함께 틀면, 수조가 가득 차기까지 몇 시간이 더 걸리는가?",o:["1.5시간","2시간","2.5시간","3시간","4시간"],a:3,

 {q:"현재 아버지의 나이는 아들 나이의 3배이고, 12년 후에는 2배가 된다. 현재 아들의 나이는?",o:["10세","12세","14세","15세","18세"],a:1,

 {q:"세 공장 A, B, C의 하루 생산량 합계는 18톤이다. A는 B보다 3톤 많고, C는 A의 2배보다 3톤 적다. C 공장의 하루 생산량은?",o:["5톤","6톤","7톤","8톤","9톤"],a:4,

 {q:"a◎b = a × b − (a + b)로 정의할 때, (3◎4)◎2의 값은?",o:["3","5","7","9","11"],a:0,

/* 시드 고정 셔플 — 선택지 순서와 인성검사 문항 순서는 매번 같다 */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
for(const k in Q)Q[k].forEach((q,i)=>{if(!q.sh)return;const p=shuffle([0,1,2,3,4],rng(hash(k+":"+i)));const o=q.o;q.o=p.map(x=>o[x]);q.a=p.indexOf(q.a)});
const ITEMS=(()=>{const all=[];G.forEach((g,gi)=>[1,2,3].forEach(k=>all.push({g:gi,k,t:g[k]})));return shuffle(all,rng(275)).slice(0,275)})();
const SETS=(()=>{const r=rng(9090);const fk=Object.keys(FACTORS).filter(f=>f!=="lie");const byF={};G.forEach(g=>{if(g[0]!=="lie")(byF[g[0]]=byF[g[0]]||[]).push(g)});
  const out=[];for(let i=0;i<90;i++){const fs=shuffle(fk,r).slice(0,3);out.push(fs.map(f=>{const gs=byF[f];const g=gs[Math.floor(r()*gs.length)];return{f,t:g[r()<.5?1:2]}}))}return out})();

function nowS(){return Date.now()}
function left(){return Math.max(0,Math.ceil((S.endAt-nowS())/1000))}
function elapsed(){return Math.max(0,Math.round((nowS()-S.secStart)/1000))}
function fmt(s){s=Math.max(0,s|0);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function mins(s){const m=Math.floor(s/60),x=s%60;return m?`${m}분 ${String(x).padStart(2,"0")}초`:`${x}초`}
function br(t){return t.replace(/\n/g,"<br>")}
const CIRC="①②③④⑤";

function startExam(flow,mode,k){arm=null;S={v:"brief",flow,mode,order:flow==="full"?ORDER.slice():[k],step:0,res:{},startedAt:nowS()};go(true)}
function begin(){
  const k=cur(),m=META[k],t=nowS();
  if(m.kind==="cat")S.res[k]={ans:Array(20).fill(null),shown:Array(20).fill(false),used:0};
  if(m.kind==="cft1")S.res[k]={vals:Array(275).fill(null),used:0};
  if(m.kind==="cft2")S.res[k]={near:Array(90).fill(null),far:Array(90).fill(null),used:0};
  S.secStart=t;S.endAt=(m.kind!=="cat"||S.mode==="exam")?t+m.min*60000:null;
  S.idx=0;S.page=0;S.si=0;arm=null;S.v=m.kind;go(true);
}
function endSec(){
  const k=cur(),m=META[k];
  S.res[k].used=S.endAt?Math.min(m.min*60,elapsed()):elapsed();
  S.res[k].done=true;S.endAt=null;S.step++;arm=null;
  if(S.step<S.order.length)S.v="brief";
  else{S.v="result";S.finishedAt=nowS();store(LAST,S)}
  go(true);
}

/* ================== 결과 ================== */
function cft1Analysis(vals){
  const by={};ITEMS.forEach((it,n)=>{const v=vals[n];if(v==null)return;(by[it.g]=by[it.g]||{})[it.k]=v});
  const prof={},incons=[],ideal=[];let measured=0,consistent=0;
  Object.entries(by).forEach(([g,o])=>{g=+g;const f=G[g][0];
    if(f==="lie"){if(o[1]===5||o[2]===5||o[3]===1)ideal.push({g,o});return}
    const norm=[];if(o[1]!=null)norm.push(o[1]);if(o[2]!=null)norm.push(o[2]);if(o[3]!=null)norm.push(6-o[3]);
    (prof[f]=prof[f]||[]).push(...norm);
    if(norm.length>=2){measured++;const sp=Math.max(...norm)-Math.min(...norm);if(sp<=1)consistent++;else incons.push({g,sp,o})}});
  const dist=[0,0,0,0,0];vals.forEach(v=>{if(v)dist[v-1]++});
  return{prof,incons:incons.sort((a,b)=>b.sp-a.sp),ideal,measured,consistent,dist,answered:vals.filter(v=>v).length};
}

    if(A1){const avg=f=>A1.prof[f]?A1.prof[f].reduce((s,x)=>s+x,0)/A1.prof[f].length:0;const top1=Object.keys(cnt).sort((a,b)=>avg(b)-avg(a)).slice(0,3),top2=fs.slice(0,3);const both=top1.filter(f=>top2.includes(f));
      cmp=`<p class="sub">Part 1 상위 요인: <b>${top1.map(f=>FACTORS[f]).join(", ")}</b> / Part 2 상위 요인: <b>${top2.map(f=>FACTORS[f]).join(", ")}</b>. ${both.length>=2?"두 파트의 응답 방향이 대체로 같아요.":"두 파트의 상위 요인이 많이 달라요. 점수형으로 답할 때와 하나를 골라야 할 때 기준이 바뀌지 않았는지 떠올려 보세요."}</p>`}
    html+=`<section class="block"><div class="bh"><h2>인성검사 Part 2</h2><span class="small muted">${doneSets} / 90세트 응답 · ${mins(r.used)}</span></div>
      <div class="card"><div class="card-h"><b>요인별 선택 횟수</b><span class="legend"><span><i style="background:var(--omr)"></i>멀다</span><span><i style="background:var(--accent)"></i>가깝다</span></span></div>
        <div class="nf">${fs.map(f=>`<div class="nf-r"><span>${FACTORS[f]}</span><span class="l"><i style="width:${cnt[f].f/mx*100}%"></i></span><span class="r"><i style="width:${cnt[f].n/mx*100}%"></i></span></div>`).join("")}</div>
        ${cmp}
      </div></section>`;
  }
  html+=`<p class="foot">해설은 직접 만든 연습 문항 기준입니다. 인성검사 분석은 이 연습장의 문항 묶음으로 계산한 참고 자료이며 CJ의 실제 평가 기준과 관계없습니다.</p></main>`;
  app.innerHTML=html;
}

/* ================== 렌더 ================== */
function render(){
  document.body.className=["cat","cft1","cft2"].includes(S.v)?"exam":"";
  ({home,brief,cat:renderCat,cft1:renderCft1,cft2:renderCft2,result})[S.v]();
}

app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.disabled)return;const d=b.dataset;
  if("full" in d){startExam("full","exam");return}
  if(d.one){startExam("single",d.mode,d.one);return}
  if("resume" in d){const sv=load(KEY);if(sv){S=sv;arm=null;go(true)}return}
  if("discard" in d){if(arm==="discard"){drop(KEY);arm=null;home()}else{arm="discard";home()}return}
  if("last" in d){const L=load(LAST);if(L){S=L;S.v="result";render();window.scrollTo(0,0)}return}
  if("quit" in d){if(arm==="quit"){arm=null;S={v:"home"};drop(KEY);go(true)}else{arm="quit";render()}return}
  if("begin" in d){begin();return}
  if("home" in d){S={v:"home"};arm=null;go(true);return}
  if("again" in d){startExam(S.flow,S.mode,S.order[0]);return}
  if(d.opt!==undefined){pick(+d.opt);return}
  if(d.mark){const [j,c]=d.mark.split("-").map(Number);S.res[cur()].ans[j]=c;S.idx=j;go();return}
  if(d.jump!==undefined){S.idx=+d.jump;arm=null;go(true);return}
  if(d.move){move(+d.move);return}
  if("check" in d||"reveal" in d){S.res[cur()].shown[S.idx]=true;go();return}
  if("armSubmit" in d){arm="submit";render();return}
  if("cancel" in d){arm=null;render();return}
  if("submit" in d){endSec();return}
  if(d.lk){const [n,x]=d.lk.split("-").map(Number);S.res.cft1.vals[n]=x;go();return}
  if("page" in d){const pages=Math.ceil(ITEMS.length/5);if(S.page>=pages-1)endSec();else{S.page++;go(true)}return}
  if(d.near!==undefined){triPick("near",+d.near);return}
  if(d.far!==undefined){triPick("far",+d.far);return}
});
document.addEventListener("keydown",e=>{
  if(S.v!=="cat"||e.metaKey||e.ctrlKey||e.altKey)return;
  const n=Number(e.key);
  if(n>=1&&n<=5){pick(n-1);e.preventDefault()}
  else if(e.key==="ArrowRight"){move(1);e.preventDefault()}
  else if(e.key==="ArrowLeft"){move(-1);e.preventDefault()}
});
setInterval(()=>{
  if(S.endAt&&ACTIVE.includes(S.v)&&S.v!=="brief"){
    const L=left(),el=document.getElementById("tm");
    if(el){el.textContent=fmt(L);el.classList.toggle("low",L<=60)}
    if(L<=0)endSec();
  }else if(S.v==="cat"){const el=document.getElementById("tm");if(el)el.textContent=fmt(elapsed())}
  else if(S.v==="home"){const d=document.getElementById("dday");if(d)d.innerHTML=ddayInner()}
},1000);
render();
</script>
</body></html>
